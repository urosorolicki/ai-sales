# Redis configuration for ai-sales-machine.
# requirepass is intentionally NOT set here - it is passed on the command line
# from ${REDIS_PASSWORD} so no credential is ever written to a tracked file.

bind 0.0.0.0
protected-mode yes
port 6379

timeout 0
tcp-keepalive 300

# Redis holds n8n queue state and short-lived agent caches. Losing it is
# recoverable, so AOF is off and RDB snapshots are enough.
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data
appendonly no

maxmemory 512mb
maxmemory-policy allkeys-lru

loglevel notice

# Commands that are never legitimate for this workload.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
